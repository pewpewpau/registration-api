<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <script type="module" src="/src/client.ts"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 3rem 1rem 4rem;
      color: #1a1a18;
    }

    .page {
      width: 100%;
      max-width: 680px;
    }

    .page-header {
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid #dddbd3;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 1;
      color: #1a1a18;
    }

    .page-header span {
      font-size: 13px;
      color: #888780;
    }

    /* ── fieldset cards ── */
    fieldset {
      border: 1px solid #dddbd3;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    legend {
      all: unset;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888780;
      background: #f8f7f3;
      padding: 13px 20px;
      border-bottom: 1px solid #dddbd3;
    }

    legend svg {
      width: 14px;
      height: 14px;
      stroke: #aaa89f;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .fields {
      padding: 18px 20px 20px;
      display: grid;
      gap: 14px;
    }

    .row {
      display: grid;
      gap: 12px;
    }

    .row.col-2 { grid-template-columns: 1fr 1fr; }
    .row.col-3 { grid-template-columns: 1fr 1fr 1fr; }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field label {
      font-size: 12px;
      font-weight: 500;
      color: #5f5e5a;
    }

    .field input {
      height: 38px;
      border: 1px solid #d3d1c7;
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: #1a1a18;
      background: #fff;
      transition: border-color 0.15s, box-shadow 0.15s;
      width: 100%;
    }

    .field input::placeholder { color: #b4b2a9; }

    .field input:focus {
      outline: none;
      border-color: #888780;
      box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    /* ── actions ── */
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .hint {
      font-size: 12px;
      color: #aaa89f;
    }

    button[type="submit"] {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1a1a18;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 24px;
      height: 42px;
      font-size: 14px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    button[type="submit"]:hover { opacity: 0.82; }
    button[type="submit"]:active { transform: scale(0.98); }

    button[type="submit"] svg {
      width: 15px;
      height: 15px;
      stroke: #fff;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ── feedback message ── */
    #msg {
      margin-top: 1rem;
      font-size: 14px;
      min-height: 1.4em;
      color: #3b6d11;
    }

    #msg.error { color: #a32d2d; }

    /* ── responsive ── */
    @media (max-width: 520px) {
      .row.col-3 { grid-template-columns: 1fr 1fr; }
      .row.col-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 360px) {
      .row.col-3 { grid-template-columns: 1fr; }
    }
  </style>
  
</head>
<body>
  <div class="page">

    <div class="page-header">
      <h1>Register</h1>
      <span>Create your account</span>
    </div>

    <form id="reg-form">

      <fieldset>
        <legend>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          Personal information
        </legend>
        <div class="fields">
          <div class="row col-3">
            <div class="field">
              <label for="first_name">First name</label>
              <input id="first_name" name="first_name" placeholder="Jane" required />
            </div>
            <div class="field">
              <label for="last_name">Last name</label>
              <input id="last_name" name="last_name" placeholder="Doe" required />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" placeholder="jane@example.com" type="email" required />
            </div>
          </div>
          <div class="row col-2">
            <div class="field">
              <label for="phone">Phone</label>
              <input id="phone" name="phone" placeholder="+264 81 000 0000" type="tel" />
            </div>
            <div class="field">
              <label for="date_of_birth">Date of birth</label>
              <input id="date_of_birth" name="date_of_birth" type="date" />
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
          Residential address
        </legend>
        <div class="fields">
          <div class="row col-3">
            <div class="field">
              <label for="res_city">City</label>
              <input id="res_city" name="res_city" placeholder="Windhoek" />
            </div>
            <div class="field">
              <label for="res_street">Street</label>
              <input id="res_street" name="res_street" placeholder="Independence Ave" />
            </div>
            <div class="field">
              <label for="res_erf">Erf number</label>
              <input id="res_erf" name="res_erf" placeholder="1234" />
            </div>
          </div>
          <div class="row col-2">
            <div class="field">
              <label for="res_country">Country</label>
              <input id="res_country" name="res_country" placeholder="Namibia" />
            </div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/></svg>
          Postal address
        </legend>
        <div class="fields">
          <div class="row col-3">
            <div class="field">
              <label for="postal_address">P.O.Box</label>
              <input id="postal_address" name="postal_address" placeholder="Box 1234" />
            </div>
            <div class="field">
              <label for="postal_city">City</label>
              <input id="postal_city" name="postal_city" placeholder="Windhoek" />
            </div>
            <div class="field">
              <label for="postal_country">Country</label>
              <input id="postal_country" name="postal_country" placeholder="Namibia" />
            </div>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <span class="hint">* First name, last name and email are required</span>
        <button type="submit">
          Register
          <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

      <p id="msg"></p>
    </form>

  </div>

  <script type="module">
    import { RegistrationClient } from "./src/client.ts";
    const client = new RegistrationClient();

    document.getElementById("reg-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd   = new FormData(e.target);
      const data = Object.fromEntries(fd.entries());
      const msg  = document.getElementById("msg");
      try {
        const result = await client.register(data);
    
        msg.className = "";
        msg.textContent = `✅ Registered! ID: ${result.id}`;
      
    } catch (err) {
        msg.className = "error";
        msg.textContent = `❌ ${err.error ?? "Something went wrong"}`;
      }
    });
  </script>
</body>
</html>
